name: Image

# 정적 사이트 이미지를 빌드해 GHCR 에 올리고 서버에 배포한다. 서버는 이미지를 받아 띄우기만 한다.
#   ghcr.io/ybbarng/mighty — nginx + 정적 빌드(Dockerfile 의 runner)
# 태그: 커밋 sha 는 항상, main 이면 latest 도.
# 서버 쪽 compose.yaml·deploy.sh 는 servers 저장소의 byb.kr/apps/mighty/ 에 있다.

on:
  push:
    branches: [main]
    # 문서만 바뀐 커밋은 이미지를 다시 만들거나 배포하지 않는다
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ybbarng/mighty
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 정적 빌드라 주소가 빌드할 때 들어간다
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://game.byb.kr
          cache-from: type=gha,scope=mighty
          cache-to: type=gha,scope=mighty,mode=max

  # 서버에 배포한다. 서버의 배포 키는 forced-command 로 servers 저장소의 apps/mighty/deploy.sh 만 실행한다.
  # 이미지를 받을 토큰은 이 실행의 GITHUB_TOKEN 을 표준입력으로 넘긴다(서버에 남지 않고, 실행이 끝나면 만료된다).
  # main 이면 운영 배포, 그 밖의 브랜치면 띄워서 헬스체크만 하고 내리는 시험(test).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH → deploy.sh
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'test' }}
        run: |
          set -euo pipefail
          # 배포 키를 아직 넣지 않았으면(서버 준비 전) 이미지만 올리고 배포는 건너뛴다
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "SERVER_SSH_KEY·SERVER_HOST 시크릿이 없어 배포를 건너뛴다"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$USER@$HOST" "$MODE $GITHUB_SHA"
          rm -f ~/.ssh/deploy_key
