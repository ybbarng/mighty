# coturn: 기기끼리 바로 이어지지 않을 때 게임 데이터를 대신 전달한다.
# 마이티는 한 판에 수십 KB만 오가므로 넉넉하게 제한해도 된다.
# 계정이 웹 번들에 들어가므로(정적 사이트) 남이 빼내 써도 피해가 작도록 아래 제한을 꼭 둔다.

listening-port=3478
# 중계에 쓰는 UDP 포트 범위. 방화벽에서 이 범위와 3478(UDP·TCP)을 연다.
min-port=49160
max-port=49200

realm=mighty.byb.kr
fingerprint
lt-cred-mech
# user=이름:비밀번호 는 compose.yaml이 환경 변수로 넣는다(--user).

# 남용 막기
# 동시에 쓸 수 있는 중계 수(전체, 계정당)
total-quota=60
user-quota=12
# 중계 하나의 최대 대역폭(바이트/초). 게임 데이터에는 이것도 충분하다.
max-bps=32000
stale-nonce=600

# 서버 안쪽 네트워크로 중계하지 못하게 한다.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
no-tlsv1
no-tlsv1_1
log-file=stdout
simple-log
