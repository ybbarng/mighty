server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 한국어 페이지라 문자 집합을 확실히 알린다(HTML 말고 CSS·JS·JSON·manifest 에도)
  charset utf-8;
  charset_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

  # TLS와 압축 협상은 앞단의 Traefik이 맡는다. 여기서는 정적 파일만 낸다.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # 배포 헬스체크(deploy.sh). 파일과 상관없이 늘 200
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Next 정적 내보내기는 /cards 를 cards.html 로 만든다.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # 하늘의 별 따기 화면은 다른 사이트의 iframe 안에서 열리지 않게 한다(패스키 단추를 겹쳐 누르게 하는
  # 클릭재킹 막기, 2026-10-31 보안 검토 B8). 다른 게임은 지금처럼 둔다.
  # 전체 CSP(D7): 바깥 스크립트·연결을 우리 출처와 구글 로그인·drand 중계·앵커 사본으로만. Next 정적 내보내기는
  # 인라인 스크립트를 써서 'unsafe-inline'이 필요하고, 작업 증명(hash-wasm)은 'wasm-unsafe-eval'이 필요하다.
  # 먼저 Report-Only로 띄워 운영 화면에서 어긋남이 없는지 본 뒤 막는 머리말로 바꾼다(docs/36 11-22)
  location = /stardraw {
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.drand.sh https://drand.cloudflare.com https://raw.githubusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri.html $uri/ =404;
  }
  location ^~ /stardraw/ {
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.drand.sh https://drand.cloudflare.com https://raw.githubusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri.html $uri/ =404;
  }

  # 파일 이름에 해시가 붙은 빌드 결과물은 오래 둔다.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 서비스 워커와 목록은 늘 새로 받아야 업데이트가 퍼진다.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  # 화면 코드 해시 목록(docs/36 11-8). 배포마다 바뀌므로 늘 새로 받는다
  location = /build-hashes.json {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    # nginx 기본 mime.types 에 .webmanifest 가 없어 octet-stream 으로 나가던 것을 고친다
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;
}
