# nostr-rs-relay 설정. 마이티는 시그널링 메시지만 주고받으므로 오래 남길 것이 없다.

[info]
relay_url = "wss://mighty.byb.kr/relay"
name = "mighty signaling"
description = "마이티 온라인 대전의 연결 중개용 릴레이"

[database]
data_directory = "/usr/src/app/db"

[network]
address = "0.0.0.0"
port = 8080
# Traefik이 앞에 있으므로 실제 접속 주소는 이 헤더에서 읽는다.
remote_ip_header = "x-forwarded-for"

[limits]
# 한 연결이 보낼 수 있는 양. 시그널링에는 넉넉하고 남용은 막는다.
messages_per_sec = 20
max_event_bytes = 65536
max_ws_message_bytes = 131072
max_ws_frame_bytes = 131072
